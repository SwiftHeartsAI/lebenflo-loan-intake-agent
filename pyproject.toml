[project]
name = "lebenflo-loan-intake"
version = "0.1.0"
description = "Loan document intake agent for Lebenflo Credit Union (a fictional credit union). All data is synthetic."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "reportlab>=4.0",                        # synthetic PDF generation
    "pydantic>=2.6",                         # typed extraction results
    "azure-ai-documentintelligence>=1.0.0",  # Document Intelligence API v4.0
    "openai>=1.40",                          # Azure OpenAI client
    "langgraph>=0.2",                        # workflow agent
    "arize-phoenix-otel>=0.6",               # sends traces to Phoenix
    "openinference-instrumentation-langchain>=0.1",
    "openinference-instrumentation-openai>=0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "arize-phoenix>=8.0",  # local Phoenix UI/server (dev only)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lebenflo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is handled by `ruff format`; long f-strings are fine

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
